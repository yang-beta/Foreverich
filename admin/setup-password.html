<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>洸限｜設定管理密碼</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="panel-card login-card">
      <div class="panel-label">GUANG XIAN · CMS AUTH</div>

      <h1 id="setupTitle">設定管理密碼</h1>

      <p id="setupIntro">
        邀請已驗證後，請在這裡建立 CMS 管理密碼。
      </p>

      <form id="passwordForm">
        <label>
          新密碼
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <label>
          再輸入一次
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </label>

        <button
          id="setPasswordBtn"
          class="primary-btn"
          type="submit"
          disabled
        >
          設定密碼
        </button>
      </form>

      <div class="status" id="passwordStatus"></div>

      <div class="auth-secondary-links">
        <a class="ghost-btn" href="./index.html">
          回管理登入頁
        </a>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"
  ></script>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="./js/setup-password.js"></script>
</body>
</html>
